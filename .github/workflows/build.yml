# Public repo => macOS runners are free.
#
# - Pull requests: unsigned compile check only (fork PRs never get secrets).
# - Push to main / manual run: signed App Store build, uploaded to TestFlight by
#   fastlane (fastlane/Fastfile).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID   10-character Team ID
#   ASC_KEY_ID      App Store Connect API key ID (the key needs the Admin role)
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      contents of AuthKey_XXXXXXXXXX.p8 (or the file base64-encoded)
#   MATCH_PASSWORD  encrypts the certificate and profile that fastlane match keeps
#                   on the `certificates` branch of this repo
# Optional, to keep them in a private repo instead:
#   MATCH_GIT_URL                  https URL of that repo
#   MATCH_GIT_BASIC_AUTHORIZATION  base64 of "username:token"
# The bundle ID is read from project.yml.
name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore", ".gitattributes"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Compile check
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild -project Encore.xcodeproj -scheme Encore -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/logs/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/logs
          if-no-files-found: ignore

  testflight:
    name: TestFlight
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write # match pushes the encrypted certificate to the certificates branch
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 MATCH_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (see the list at the top of build.yml)"; missing=1; fi
          done
          exit $missing

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install fastlane
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          fastlane --version | tail -1

      - name: Sign, build and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL || format('https://github.com/{0}.git', github.repository) }}
          PRIVATE_MATCH_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          REPO_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          if [ -n "$PRIVATE_MATCH_AUTH" ]; then
            MATCH_GIT_BASIC_AUTHORIZATION="$PRIVATE_MATCH_AUTH"
          else
            # This repo's own token, which can push the certificates branch.
            MATCH_GIT_BASIC_AUTHORIZATION=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          fi
          echo "::add-mask::$MATCH_GIT_BASIC_AUTHORIZATION"
          export MATCH_GIT_BASIC_AUTHORIZATION
          fastlane ios beta

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/logs
          if-no-files-found: ignore
