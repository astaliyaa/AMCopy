# Public repo => macOS runners are free.
#
# - Pull requests: unsigned compile check only (fork PRs never get secrets).
# - Push to main / manual run: signed App Store build, uploaded to TestFlight.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   IOS_DIST_CERT_P12_BASE64         Apple Distribution certificate (.p12), base64
#   IOS_DIST_CERT_PASSWORD           password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  App Store provisioning profile (.mobileprovision), base64
#   ASC_KEY_ID                       App Store Connect API key ID
#   ASC_ISSUER_ID                    App Store Connect API issuer ID
#   ASC_PRIVATE_KEY                  contents of AuthKey_XXXXXXXXXX.p8
# Team ID and bundle ID are read from the provisioning profile.
name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "signing/**", ".gitignore"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGNED: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # ---------- Pull requests: compile check, no signing ----------

      - name: Build (unsigned)
        if: env.SIGNED != 'true'
        run: |
          set -o pipefail
          xcodebuild -project Encore.xcodeproj -scheme Encore -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      # ---------- main: sign, archive, upload to TestFlight ----------

      - name: Check secrets
        if: env.SIGNED == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in P12 P12_PASSWORD PROFILE ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see the list at the top of build.yml)"; missing=1; fi
          done
          exit $missing

      - name: Install certificate and provisioning profile
        if: env.SIGNED == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$P12" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE" | tr -d '\r\n ' | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer" \
            && security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN_PATH" || true
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          if [[ "$IDENTITIES" != *"Apple Distribution"* ]]; then
            echo "::error::The .p12 doesn't contain a valid Apple Distribution identity"
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")
          NAME=$(plutil -extract Name raw -o - "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw -o - "$RUNNER_TEMP/profile.plist")
          APP_ID=$(plutil -extract Entitlements.application-identifier raw -o - "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#*.}"

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$UUID.mobileprovision"
          done

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Signing $BUNDLE_ID for team $TEAM_ID with profile \"$NAME\""

      - name: Archive
        if: env.SIGNED == 'true'
        run: |
          set -o pipefail
          xcodebuild -project Encore.xcodeproj -scheme Encore -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Encore.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}" \
            archive 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Export IPA
        if: env.SIGNED == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Encore.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" 2>&1 | tee -a "$RUNNER_TEMP/build.log" | grep -E "error:|EXPORT (SUCCEEDED|FAILED)"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}.${{ github.run_attempt }}. It shows up in TestFlight after Apple finishes processing (usually 5–30 min)."

      # ---------- Always ----------

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/appstore.mobileprovision "$RUNNER_TEMP"/profile.plist
          rm -rf "$HOME/.appstoreconnect"
